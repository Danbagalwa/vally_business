<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Remplacé au build par --base-href (« /nom-du-depot/ » sur GitHub Pages). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ventes, commandes, stock et clients de la boutique.">
  <meta name="theme-color" content="#FFF7FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1218" media="(prefers-color-scheme: dark)">

  <!-- iPhone : appli plein écran une fois ajoutée à l'écran d'accueil. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vally">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Vally Business</title>
  <link rel="manifest" href="manifest.json">

  <!-- Compression des photos d'articles dans le navigateur (flutter_image_compress). -->
  <script src="https://cdn.jsdelivr.net/npm/pica@9.0.1/dist/pica.min.js" defer></script>

  <style>
    /* Fond de la charte pendant le chargement, au lieu d'un écran blanc. */
    html, body { margin: 0; height: 100%; background: #FFF7FA; }
    @media (prefers-color-scheme: dark) { html, body { background: #1E1218; } }
    #chargement {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 600 15px -apple-system, system-ui, sans-serif; color: #6E5562;
    }
    @media (prefers-color-scheme: dark) { #chargement { color: #C9AEBB; } }
  </style>
</head>
<body>
  <div id="chargement">Ouverture de la boutique…</div>
  <script>
    // Retire le message dès que Flutter a dessiné sa première image.
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('chargement');
      if (c) c.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
