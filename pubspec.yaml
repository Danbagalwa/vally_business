name: vally_business
description: "Vally Business : stock, ventes et argent de ta boutique."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  material_ui: any

  # Kit Vally Business
  flutter_native_splash: ^2.4.8   # garde l'écran de démarrage pendant le chargement (preserve/remove)

  # Application
  supabase_flutter: ^2.18.3
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  fl_chart: ^1.3.1
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  flutter_image_compress: ^2.5.1
  shared_preferences: ^2.5.6
  pdf: ^3.13.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Kit Vally Business
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/
  fonts:
    # Titres : Space Grotesk Bold (licence SIL OFL, assets/fonts/OFL-SpaceGrotesk.txt).
    # Le reste du texte utilise la police du système : Roboto (Android),
    # San Francisco (iPhone).
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700

# ── Icône de l'application ───────────────────────────────────
#  Commande : dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"        # 1024×1024, sans transparence
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#FCE4EC"           # rose pâle
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0             # le dessin a déjà sa marge de sécurité
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"   # icône à thème Android 13+
  ios: true
  remove_alpha_ios: true                        # l'App Store refuse la transparence
  background_color_ios: "#FCE4EC"
  # Web (PWA sur iPhone) : icônes du dossier web/icons et favicon.
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFF7FA"
    theme_color: "#C2255C"

# ── Écran de démarrage ───────────────────────────────────────
#  Commande : dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFF7FA"
  image: assets/splash/splash_logo.png
  branding: assets/splash/branding.png
  branding_mode: bottom
  branding_bottom_padding: 48
  color_dark: "#1E1218"
  image_dark: assets/splash/splash_logo.png
  branding_dark: assets/splash/branding_dark.png

  android_12:
    image: assets/splash/splash_android12.png
    color: "#FFF7FA"
    icon_background_color: "#FFF7FA"
    image_dark: assets/splash/splash_android12.png
    color_dark: "#1E1218"
    icon_background_color_dark: "#1E1218"

  android: true
  ios: true
  web: false
